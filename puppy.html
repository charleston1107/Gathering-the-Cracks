
<!-- shadow_poetry/frontend/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puppy</title>
  <style>
    body {
      font-family: elevon, sans-serif;
      background-color: #000;
      color: rgba(255,255,255,0.8);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-container {
      width: 70vw;
      height: 70vh;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      transition: all 0.8s ease;
      cursor: pointer;
    }
    .image-container img, .image-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      position: absolute;
      transition: opacity 1.5s ease;
    }
    .image-container img.active, .image-container video.active {
      opacity: 1;
    }
    .poem {
      margin-top: 2rem;
      text-align: center;
      opacity: 0.7;
      font-size: 1.2rem;
      line-height: 2;
      max-width: 70vw;
      transition: all 0.5s ease;
    }
    #returnButton {
      font-size: 1.5rem;          /* Bigger text */
      padding: 1rem 2rem;         /* Expand clickable area */
      display: inline-block;      /* Prevent shrinking inside flex/grid parents */
      transform: scale(1); 
      min-width: 200px; 
      margin-top: 2rem;
    }
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="image-container" id="media-container">
    <img src="https://pub-4d457e07e6ef4aaa8ac96b51bf19ad36.r2.dev/assets/img/puppy/dhouse.jpg" alt="Puppy" class="active" id="current-image">
    <video id="next-video" loop>
      <source src="https://pub-4d457e07e6ef4aaa8ac96b51bf19ad36.r2.dev/assets/img/puppy/realtime dog barking.mp4" type="video/mp4">
    </video>
  </div>
  <div class="poem">
    A timid dog, when approached, forgets its silence and barks without pause—as if noise were its 
    only armor against the nearness of the world. (click image to watch video).
  </div>
<button id="returnButton" class="bg-white text-black px-6 py-3 font-bold hover:bg-gray-200 transition">
      ↩  Return to Map
    </button>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    // 粒子效果初始化
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" }
        }
      }
    });

    // 图片切换逻辑
    const currentImage = document.getElementById('current-image');
    const nextVideo = document.getElementById('next-video');
    const mediaContainer = document.getElementById('media-container');
    
    let isShowingImage = true;

    function changeMedia() {
      if(isShowingImage) {
        currentImage.classList.remove('active');
        nextVideo.classList.add('active');
        nextVideo.play();
      } else {
        nextVideo.classList.remove('active');
        currentImage.classList.add('active');
        nextVideo.pause();
      }
      isShowingImage = !isShowingImage;
    }

    // 点击图片容器切换媒体
    mediaContainer.addEventListener('click', changeMedia);

    document.getElementById('returnButton').addEventListener('click', () => {
        window.location.href = "map3dscene.html";
    });
  </script>
</body>
</html>
