    <p class="Chinese">
        走到田野深处时<br>
        你会注意到家禽的张望<br>
        门洞里走出大小的犬，然后是老人，然后是将老的人<br>
        <br>
        没有人走的更近了<br>
        生灵仿佛从诞生起就被训诫：要安静<br>
        这条河也并不属于谁家<br>
        无名的古桥，无名的河流。<br>
        这以当地大湖命名的整个村落<br>
        或许没有太多区别<br>
<br>
        大地灰白——<br>
        将要沿途而返时，走来一个还家的老人<br>
        边走边端详<br>
        她笑着问我们的来处<br>
        说起此地稀少的过客<br>
        然后又指向远处，<br>
        这是谁家的地 这是谁家的坟<br>

    </p>
